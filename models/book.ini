[model]
name = Book
label = {{ this.title }}

[fields.title]
type = string
label = Title

# Order within the master Books listing (1..13). Lektor's default
# child order is alphabetical by folder name, which puts bookIX
# between bookIV and bookV. The TOC template sorts by this field.
[fields.order]
type = integer
label = Order

# One-line summary shown next to the book in the master Table of
# Contents. Preserve Joyce's original terse wording — these are
# Joyce's master-TOC captions at
# http://aleph0.clarku.edu/~djoyce/elements/elements.html.
[fields.short_description]
type = string
label = Short description

# Optional interleaved-batches structure. When populated, the book
# template renders Definitions and Propositions woven together — each
# subsection's defs, followed by the prop range that depends on them
# (e.g. Book X's DefsI → Props 1-47 → DefsII → Props 48-84 → DefsIII
# → Props 85-115, matching Joyce's and Heath's presentation). When
# empty, defs and props render as two flat blocks, the existing
# default for Books I-IX, XI-XIII. See flowblocks/book_subsection.ini
# for the per-batch schema.
[fields.subsections]
type = flow
label = Subsections (interleaved batches of defs + props)
flow_blocks = book_subsection

# Long-form prose for the book — rendered under a "Guide to {Book}"
# heading in the book template. Optional. Authored in Markdown; the
# Lektor renderer turns it into HTML at build time.
[fields.guide]
type = markdown
label = Guide
