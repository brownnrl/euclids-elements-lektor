[model]
name = Book
label = {{ this.title }}

[fields.title]
type = string
label = Title

# One-line summary shown next to the book in the master Table of
# Contents (e.g. "The fundamentals of geometry: theories of
# triangles, parallels, and area").
[fields.short_description]
type = string
label = Short description

# Long-form prose for the book — rendered under a "Guide to {Book}"
# heading in the book template. Optional.
[fields.body]
type = html
label = Guide body
