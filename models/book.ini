[model]
name = Book
label = {{ this.title }}

[fields.title]
type = string
label = Title

# Order within the master Books listing (1..13). Lektor's default
# child order is alphabetical by folder name, which puts bookIX
# between bookIV and bookV. The TOC template sorts by this field.
[fields.order]
type = integer
label = Order

# One-line summary shown next to the book in the master Table of
# Contents. Preserve Joyce's original terse wording — these are
# Joyce's master-TOC captions at
# http://aleph0.clarku.edu/~djoyce/elements/elements.html.
[fields.short_description]
type = string
label = Short description

# Long-form prose for the book — rendered under a "Guide to {Book}"
# heading in the book template. Optional. Authored in Markdown; the
# Lektor renderer turns it into HTML at build time.
[fields.body]
type = markdown
label = Guide body
