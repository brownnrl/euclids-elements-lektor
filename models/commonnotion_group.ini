[model]
name = Common notion group (shared guide)
label = {{ this.title }}

# A "group" page holds the markdown guide shared by all common
# notions whose source HTML was bundled together (cn1-5 in
# bookI/cn.html). It's referenced from each common notion via the
# `group` field. Mark the group folder `_hidden: yes` so it doesn't
# appear in the section index.

[fields.title]
type = string
label = Title (e.g. "Common Notions")

[fields.guide]
type = markdown
label = Shared guide
