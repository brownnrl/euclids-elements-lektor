[model]
name = Common Notion
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "C.N.")

[fields.guide]
type = markdown
label = Guide
description = Prose commentary. Ignored when `group` is set — the bundle template uses the group's body instead.

[fields.statement]
type = html
label = One-line statement / claim

[fields.order]
type = integer
label = Sort order within section

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?

# Slug of a sibling `commonnotion_group` page whose body is the
# shared guide. The bundle template renders a single combined
# theorem box listing every group member's statement, then the
# group's body underneath.
[fields.group]
type = string
label = Shared-guide group slug
