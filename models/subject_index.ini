[model]
name = Subject Index
label = {{ this.title }}

# The index is ~270 entries with ~565 sub-entries and ~860 citations. Held as
# HTML it was a 1500-line body that nothing could validate and CSS could not
# see individual entries in. It lives in databags/subject_index.json instead,
# and templates/subject_index.html renders it; scripts/check-subjindex.py
# resolves every citation, cross-reference and anchor in it at build time.

[fields.title]
type = string
label = Title

[fields.body]
type = markdown
label = Introductory prose (optional)
description = Rendered above the index proper. The entries themselves come from the databag, not from here.
