[model]
name = Definition group (shared guide)
label = {{ this.title }}

# A "group" page holds a markdown guide that's shared by several
# definitions whose source HTML was bundled together (e.g. defs 15–18
# all live in defI15.html with a single combined Guide section).
# It's referenced from each definition via the `group` field.
# Mark the group folder `_hidden: yes` so it doesn't appear in the
# section index alongside the real definitions.

[fields.title]
type = string
label = Title

[fields.body]
type = markdown
label = Shared guide body (Markdown)
