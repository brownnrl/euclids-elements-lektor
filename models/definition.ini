[model]
name = Definition
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "I.Def.1")
description = Shown next to the link in parent book TOC.

[fields.body]
type = markdown
label = Guide body (Markdown)
description = Prose commentary for the definition. The theorem box (heading + statement) is constructed by the template from `title` and `statement`, so don't repeat them here.

[fields.statement]
type = html
label = One-line statement / claim

[fields.order]
type = integer
label = Sort order within section

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?

# Slug of a sibling `definition_group` page whose body should be
# rendered as this definition's guide. Used when the source HTML
# bundles several definitions under one combined Guide (e.g. defs
# 15-18 share defI15_18). When set, `body` on this page is ignored
# in favor of the group's body.
[fields.group]
type = string
label = Shared-guide group slug
