[model]
name = Postulate
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "I.Post.1")

[fields.body]
type = markdown
label = Guide body (Markdown)
description = Prose commentary for the postulate. The theorem box (heading + statement) is constructed by the template from `title` and `statement`, so don't repeat them here. Embedded geomlib diagrams go inside <figure class="diagram"> blocks.

[fields.statement]
type = html
label = One-line statement / claim

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?

[fields.order]
type = integer
label = Sort order within section
