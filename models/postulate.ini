[model]
name = Postulate
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "I.Post.1")

[fields.body]
type = html
label = Body

[fields.statement]
type = html
label = One-line statement / claim

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?

[fields.order]
type = integer
label = Sort order within section
