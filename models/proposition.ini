[model]
name = Proposition
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "I.7")
description = Compact citation form shown in bottom navigation and master TOC.

[fields.proof]
type = markdown
label = Construction & proof (Markdown)
description = Renders inside the theorem (beige) box, after the statement. Ends with the Q.E.F. or Q.E.D. line. Marginal justifications use raw <div class="just">…</div> inline.

[fields.body]
type = markdown
label = Guide body (Markdown)
description = Commentary rendered below the theorem box under a "Guide" heading. h4 subsections are common.

# Optional override of the geomlib pin used by the page's canvas
# scripts. Defaults to the layout's project-wide pin.
[fields.geomlib_version]
type = string
label = geomlib version (override; blank = use layout default)

[fields.statement]
type = html
label = One-line statement / claim

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?

[fields.order]
type = integer
label = Sort order within section

# Auxiliary TOC entries that appear BEFORE the main proposition entry
# in the parent book's table of contents. The first one occupies the
# <dd> slot (replacing the prop's own statement there); the rest become
# trailing <p> blocks; finally the prop's own title + statement are
# emitted as a closing <p>. Used for the lemmas Joyce/Heath print
# before a proposition (e.g. X.19, X.22, X.29 with its two lemmas).
[fields.toc_pre]
type = flow
label = TOC pre-entries (lemmas before the prop)
flow_blocks = prop_toc_aux

# Auxiliary TOC entries that appear AFTER the main proposition entry.
# The prop's own statement occupies <dd>; each post-entry is a trailing
# <p>. Used for corollaries (X.3, X.4, X.23, …) and follow-up lemmas
# / propositions (X.41, X.72, X.111).
[fields.toc_post]
type = flow
label = TOC post-entries (corollaries / follow-ups after the prop)
flow_blocks = prop_toc_aux
