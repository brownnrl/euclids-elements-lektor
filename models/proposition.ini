[model]
name = Proposition
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.short_label]
type = string
label = Short label (e.g. "I.7")
description = Compact citation form shown in bottom navigation and master TOC.

# Optional override of the geomlib pin used by the page's canvas
# scripts. Defaults to the layout's project-wide pin.
[fields.geomlib_version]
type = string
label = geomlib version (override; blank = use layout default)

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?
description = Drives the <dt> red class in the parent book's TOC. Individual sections set their own red_highlight independently.

[fields.order]
type = integer
label = Sort order within section

# A proposition's content is one or more sections — each rendered as its
# own beige theorem box on the page (matching Joyce/Heath/Heiberg's
# presentation). A simple prop has a single kind=proposition section.
# Props with lemmas/corollaries/notes/follow-ups carry several sections
# in order: lemmas first, then the proposition, then post-content.
#
# The parent book's TOC is also driven by this list — the kind=proposition
# section's statement occupies <dd> (or the first section's statement if
# there are pre-lemmas, matching Joyce's bookX.html), and other sections
# become <p> aux entries before or after based on order. See
# flowblocks/prop_section.ini.
[fields.sections]
type = flow
label = Sections (lemmas, proposition, corollaries, notes)
flow_blocks = prop_section
