[model]
name = Proposition
label = {{ this.title }}

[fields.title]
type = string
label = Title

[fields.body]
type = html
label = Body

# Optional override of the geomlib pin used by the page's canvas
# scripts. Defaults to the layout's project-wide pin.
[fields.geomlib_version]
type = string
label = geomlib version (override; blank = use layout default)

[fields.statement]
type = html
label = One-line statement / claim

[fields.is_construction]
type = boolean
label = Is a construction (Q.E.F.)?

[fields.order]
type = integer
label = Sort order within section
