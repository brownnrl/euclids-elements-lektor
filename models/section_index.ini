[model]
name = Section Index
label = {{ this.title }}

[fields.title]
type = string
label = Title

# Which child model this section is grouping. Lets the template
# filter children consistently regardless of folder name.
# Values: definition / postulate / commonnotion / proposition
[fields.child_model]
type = string
label = Child model identifier

# Optional intro prose rendered above the auto-list.
[fields.body]
type = html
label = Body
