[block]
name = Book subsection
button_label = Add subsection

# Roman subsection identifier (I, II, III). Used as the anchor id
# (#defs-I, #props-I) AND as the key joining this subsection to its
# defs — the book template matches `id` against each def's
# `subsection:` field. Propositions don't carry a subsection field
# (they're globally numbered in Book X), so prop membership uses the
# prop_lo / prop_hi range instead.
[fields.id]
type = string
label = Subsection id (Roman)

[fields.def_label]
type = string
label = Definitions heading

[fields.def_caption]
type = string
label = Definitions caption (italicised subtitle)

[fields.prop_label]
type = string
label = Propositions heading

[fields.prop_lo]
type = integer
label = First prop order

[fields.prop_hi]
type = integer
label = Last prop order
