[block]
name = Proposition TOC aux entry
button_label = Add aux entry

# An auxiliary entry attached to a proposition's TOC card. Used for
# the lemmas (sometimes more than one) that Joyce/Heath print
# alongside a proposition on its page, and for corollaries / follow-up
# propositions that appear after it. Each entry is rendered as a
# bold <a href="<prop_url>#<anchor>">label.</a> optionally followed by
# its statement, inside either a <dd> or a <p> (see book.html macro).

[fields.label]
type = string
label = Display label
description = e.g. "Lemma", "Lemma 1", "Corollary", "Corollary 2", "Proposition" — author's wording, no trailing period.

[fields.anchor]
type = string
label = URL anchor
description = Hash fragment on the proposition page — "lemma", "lemma1", "cor", "cor2", "prop".

[fields.statement]
type = html
label = Statement (optional)
description = Leave blank for entries Joyce shows as just a label (e.g. X.19's bare "Lemma." link).

[fields.red_highlight]
type = boolean
label = Render in red?
