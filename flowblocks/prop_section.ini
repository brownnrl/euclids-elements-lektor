[block]
name = Proposition section
button_label = Add section

# A logical section of a proposition's page — its own beige theorem box
# on the rendered page. The template handles ALL the box scaffolding
# (<div class="theorem">, <h1>, <div class="statement">); author content
# is just markdown in `proof` and/or `guide`. The `kind` field drives
# the default heading and anchor, so the same template covers
# propositions, lemmas, corollaries, notes, remarks — and future works
# can introduce scholia, porisms, etc. by extending the choice list.

[fields.kind]
type = select
label = Kind
description = Determines the default heading label and URL anchor.
[fields.kind.choices]
proposition = Proposition
lemma = Lemma
corollary = Corollary
note = Note
remark = Remark

[fields.label]
type = string
label = Label override
description = e.g. "Lemma 1.", "Lemma 2.", "Corollary 2." — overrides the default ("Lemma.", "Corollary.") derived from kind. Leave blank for the single-of-its-kind case.

[fields.anchor]
type = string
label = Anchor id override
description = Defaults to the kind value (lemma, cor, prop, note, remark). Override when multiple sections share a kind: lemma1, lemma2, cor2.

[fields.statement]
type = html
label = Statement (italic one-line claim)
description = Optional. Shown right under the heading. Inline HTML only (<i>, <em>); no <div> scaffolding.

# Joyce's book indexes sometimes summarise a section in words that appear
# nowhere on the page itself — bookXIII lists the XIII.18 remark as "No other
# figure … can be constructed BY equilateral and equiangular figures", while
# the page reads "I say next that no other figure … can be constructed WHICH
# IS CONTAINED BY …". Putting the index wording in `statement` would print a
# near-duplicate of the opening sentence into the proof. So the contents entry
# gets its own field, and falls back to `statement` when there isn't one.
[fields.toc_summary]
type = html
label = Contents-listing summary
description = Optional. Text shown after this section's link in the parent book's contents, when the page itself carries no statement to reuse. Inline HTML only.

[fields.proof]
type = markdown
label = Construction & proof
description = Markdown body for proof-style sections (proposition, lemma, corollary). Marginal justifications still use raw <div class="just">…</div> inline.

[fields.guide]
type = markdown
label = Guide / discussion
description = Markdown commentary. Used by note/remark sections; also rendered below a proposition's proof when present. h4 subsections are common.

[fields.red_highlight]
type = boolean
label = Render in red (highlight)?
